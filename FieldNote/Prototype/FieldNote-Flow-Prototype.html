<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldNote Prototype</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --paper:#F4F1E9;--surface:#FCFAF5;--surface-2:#EBE7DD;--ink:#1B1A15;--ink-2:#4C4A40;--ink-3:#807D70;
    --line:#E0DBCF;--line-2:#CDC7B8;--slate:#3B372C;--slate-soft:#EAE6DB;--signal:#1F5140;--signal-soft:#E1EAE4;
    --good:#2E6E4E;--good-soft:#DEEAE1;--warn:#8C6212;--warn-soft:#F2E7CF;--crit:#8C3A34;--crit-soft:#F0DEDC;--mute:#6B6656;--mute-soft:#E9E5DB;
    --display:'Fraunces',Georgia,serif;--body:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --paper:#15140E;--surface:#1E1C14;--surface-2:#26231A;--ink:#EEEADF;--ink-2:#B8B2A2;--ink-3:#847F6E;
    --line:#302D22;--line-2:#403C2E;--slate:#B7AF9C;--slate-soft:#252217;--signal:#83BBA3;--signal-soft:#182720;
    --good:#6FBF95;--good-soft:#16281E;--warn:#D8A24A;--warn-soft:#2B2411;--crit:#E0908A;--crit-soft:#2E1918;--mute:#9A9482;--mute-soft:#221F16;
  }}
  :root[data-theme="dark"]{
    --paper:#15140E;--surface:#1E1C14;--surface-2:#26231A;--ink:#EEEADF;--ink-2:#B8B2A2;--ink-3:#847F6E;
    --line:#302D22;--line-2:#403C2E;--slate:#B7AF9C;--slate-soft:#252217;--signal:#83BBA3;--signal-soft:#182720;
    --good:#6FBF95;--good-soft:#16281E;--warn:#D8A24A;--warn-soft:#2B2411;--crit:#E0908A;--crit-soft:#2E1918;--mute:#9A9482;--mute-soft:#221F16;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}
  .mono{font-family:var(--mono);}

  /* top bar */
  header.bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);}
  .bar-in{max-width:1120px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;}
  .brand{font-family:var(--display);font-size:19px;font-weight:500;letter-spacing:.015em;color:var(--ink);}
  .brand span{color:var(--signal);}
  nav.tabs{display:flex;gap:20px;margin-left:16px;}
  nav.tabs button{padding:8px 2px;font-size:.9rem;color:var(--ink-3);font-weight:500;position:relative;}
  nav.tabs button:hover{color:var(--ink-2);}
  nav.tabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--signal);}
  .spacer{margin-left:auto;}
  .rolechip{display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;font-size:.8rem;color:var(--ink-2);background:var(--surface);}
  .rolechip b{color:var(--ink);font-weight:600;}
  .rolechip .edit{color:var(--signal);font-family:var(--mono);font-size:.7rem;}
  .iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--ink-2);}
  @media(max-width:640px){.rolechip .r-txt{display:none;} nav.tabs button{padding:6px 9px;}}

  main{max-width:1120px;margin:0 auto;padding:20px 18px 60px;}

  /* library layout */
  .lib{display:grid;grid-template-columns:230px 1fr;gap:22px;}
  @media(max-width:800px){.lib{grid-template-columns:1fr;}}
  .filters{align-self:start;position:sticky;top:70px;}
  @media(max-width:800px){.filters{position:static;}}
  .fgroup{margin-bottom:18px;}
  .fgroup .h{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;}
  .search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-size:.9rem;}
  .search::placeholder{color:var(--ink-3);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:5px 10px;border:1px solid var(--line);border-radius:20px;font-size:.78rem;color:var(--ink-2);background:var(--surface);}
  .chip.on{background:var(--slate);color:#fff;border-color:var(--slate);}
  .chip.g.on{background:var(--slate);}
  .toggle{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--ink-2);cursor:pointer;}
  .toggle input{accent-color:var(--signal);}
  .clearf{font-size:.78rem;color:var(--signal);margin-top:4px;}

  .count{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-bottom:12px;}
  .cards{display:flex;flex-direction:column;gap:12px;}
  .card{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px 18px;cursor:pointer;transition:border-color .12s,transform .12s;}
  .card:hover{border-color:var(--line-2);transform:translateY(-1px);}
  .card .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .logo{width:30px;height:30px;border-radius:7px;background:var(--slate-soft);color:var(--slate);font-weight:600;font-size:.8rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .card h3{font-family:var(--display);font-weight:500;font-size:1.16rem;margin:0;line-height:1.2;flex:1;min-width:180px;}
  .card .tldr{font-size:.88rem;color:var(--ink-2);margin:6px 0 10px;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);text-transform:uppercase;}
  .tag.mdl{background:var(--slate-soft);color:var(--slate);}
  .grade{font-family:var(--mono);font-weight:600;font-size:11px;color:#fff;min-width:20px;height:20px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;}
  .gA{background:var(--good);}.gB{background:var(--slate);}.gC{background:var(--warn);}.gD{background:var(--crit);}.gX{background:var(--mute);}
  .badge{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.03em;padding:2px 7px;border-radius:20px;text-transform:uppercase;}
  .badge.ver{background:var(--good-soft);color:var(--good);}
  .badge.cand{background:var(--warn-soft);color:var(--warn);}
  .badge.hold{background:var(--crit-soft);color:var(--crit);}
  .fresh{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:auto;}

  /* detail */
  .detail{max-width:780px;margin:0 auto;}
  .back{font-size:.85rem;color:var(--signal);margin-bottom:16px;display:inline-flex;gap:6px;align-items:center;}
  .dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px;}
  .dhead .logo{width:44px;height:44px;font-size:1.05rem;border-radius:10px;}
  .detail h2{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.12;margin:0 0 4px;}
  .detail .speaker{font-size:.9rem;color:var(--ink-2);}
  .drow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0;}
  .fitbox{border-left:3px solid var(--signal);background:var(--signal-soft);padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;}
  .fitbox .k{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--signal);margin-bottom:5px;}
  .fitbox p{margin:0;font-size:.9rem;color:var(--ink);}
  .tier{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden;}
  .tier .th{padding:11px 16px;background:var(--surface-2);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;cursor:pointer;}
  .tier .tb{padding:4px 16px 14px;}
  .field{padding:12px 0;border-bottom:1px solid var(--line);}
  .field:last-child{border-bottom:none;}
  .field .l{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--slate);margin-bottom:5px;}
  .field p{margin:0;font-size:.92rem;color:var(--ink-2);}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:2px 0;}
  .metrics div{background:var(--surface);padding:9px 11px;}
  .metrics b{font-family:var(--display);font-size:1.15rem;display:block;line-height:1;}
  .metrics span{font-size:.68rem;color:var(--ink-2);display:block;margin-top:5px;line-height:1.3;}
  @media(max-width:520px){.metrics{grid-template-columns:1fr 1fr;}}
  .quote{border-left:2px solid var(--signal);padding:3px 0 3px 12px;margin:9px 0;font-family:var(--display);font-style:italic;color:var(--ink);font-size:.96rem;line-height:1.4;}
  .quote .c{display:block;font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--ink-3);margin-top:5px;}
  .flagline{font-size:.85rem;color:var(--ink-2);background:var(--warn-soft);border-radius:8px;padding:9px 12px;margin:8px 0;}
  .flagline b{color:var(--warn);}
  .srcs{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);line-height:1.7;}
  .holdnote{background:var(--crit-soft);border-radius:10px;padding:14px 16px;font-size:.9rem;color:var(--ink);}
  .holdnote b{color:var(--crit);}

  /* chat */
  .chat{max-width:720px;margin:0 auto;}
  .chatwin{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;height:min(66vh,560px);}
  .chatlog{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
  .msg{max-width:86%;font-size:.92rem;line-height:1.5;}
  .msg.u{align-self:flex-end;background:var(--slate);color:#fff;padding:9px 14px;border-radius:14px 14px 3px 14px;}
  .msg.a{align-self:flex-start;color:var(--ink-2);}
  .msg.a .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin-bottom:5px;}
  .msg.a .bubble{background:var(--surface-2);padding:11px 15px;border-radius:3px 14px 14px 14px;}
  .msg.a .bubble strong{color:var(--ink);}
  .cites{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px;}
  .cite{font-family:var(--mono);font-size:9.5px;padding:3px 9px;border:1px solid var(--slate);color:var(--slate);border-radius:20px;background:var(--slate-soft);}
  .cite.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);}
  .suggest{display:flex;flex-wrap:wrap;gap:7px;padding:0 18px 12px;}
  .suggest button{font-size:.8rem;color:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:6px 12px;background:var(--surface);text-align:left;}
  .suggest button:hover{border-color:var(--slate);color:var(--ink);}
  .chatin{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);}
  .chatin input{flex:1;padding:10px 14px;border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);font-size:.9rem;}
  .chatin button{width:40px;height:40px;border-radius:50%;background:var(--slate);color:#fff;font-size:1rem;flex-shrink:0;}
  .disclaimer{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center;margin-top:12px;line-height:1.5;}

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal .box{background:var(--surface);border:1px solid var(--line-2);border-radius:16px;max-width:440px;width:100%;padding:26px;}
  .modal h3{font-family:var(--display);font-weight:500;font-size:1.5rem;margin:0 0 6px;}
  .modal p{font-size:.88rem;color:var(--ink-2);margin:0 0 16px;}
  .modal label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:block;margin:12px 0 5px;}
  .modal select,.modal input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font-size:.9rem;}
  .modal .go{margin-top:20px;width:100%;padding:11px;border-radius:10px;background:var(--signal);color:#fff;font-weight:600;font-size:.92rem;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);margin-bottom:10px;}
  .note{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center;padding:14px;}

  /* home */
  .home{max-width:880px;margin:0 auto;}
  .hero{padding:26px 0 6px;}
  .hero .eyebrow{margin-bottom:12px;}
  .hero h1{font-family:var(--display);font-weight:500;font-size:clamp(2rem,5vw,3rem);line-height:1.04;letter-spacing:-.015em;margin:0 0 14px;max-width:16ch;}
  .hero .sub{font-family:var(--display);font-size:clamp(1.05rem,2vw,1.28rem);line-height:1.44;color:var(--ink-2);max-width:60ch;margin:0;}
  .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;}
  .cta .primary{background:var(--signal);color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;font-size:.92rem;}
  .cta .ghost{border:1px solid var(--line-2);padding:11px 20px;border-radius:10px;color:var(--ink);font-size:.92rem;background:var(--surface);}
  .homestats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:26px 0 6px;}
  .homestats div{background:var(--surface);padding:14px 16px;}
  .homestats b{font-family:var(--display);font-size:1.5rem;display:block;line-height:1;}
  .homestats b.sg{color:var(--signal);}.homestats b.gd{color:var(--good);}
  .homestats span{font-size:.74rem;color:var(--ink-2);display:block;margin-top:6px;line-height:1.3;}
  @media(max-width:640px){.homestats{grid-template-columns:1fr 1fr;}}
  .sec-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin:36px 0 18px;padding-bottom:10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;}
  .sec-h a{color:var(--signal);font-size:.95em;cursor:pointer;letter-spacing:.04em;}
  .wfcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:640px){.wfcards{grid-template-columns:1fr;}}
  .wfcard{border:1px solid var(--line);border-radius:12px;padding:16px 17px;cursor:pointer;background:var(--surface);transition:border-color .12s,transform .12s;}
  .wfcard:hover{border-color:var(--line-2);transform:translateY(-1px);}
  .wfcard.soon{opacity:.72;cursor:default;}
  .wfcard h4{font-family:var(--display);font-weight:500;font-size:1.1rem;margin:0 0 6px;color:var(--ink);}
  .wfcard p{font-size:.83rem;color:var(--ink-2);margin:0 0 10px;}
  .wfcard .cnt{font-family:var(--mono);font-size:10px;color:var(--slate);}
  .wfcard .cnt.zero{color:var(--warn);}
  .pipe{display:flex;flex-direction:column;gap:8px;}
  .piperow{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);}
  .piperow .lg{width:26px;height:26px;border-radius:6px;background:var(--slate-soft);color:var(--slate);font-size:.72rem;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .piperow .nm{font-weight:600;font-size:.9rem;}
  .piperow .ds{font-size:.82rem;color:var(--ink-3);flex:1;}
  @media(max-width:560px){.piperow .ds{display:none;}}
  .trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface-2);}
  @media(max-width:640px){.trust{grid-template-columns:1fr 1fr;}}
  .tstep{position:relative;}
  .tstep .n{font-family:var(--mono);font-size:10px;color:var(--signal);}
  .tstep b{display:block;font-size:.9rem;margin:3px 0 2px;color:var(--ink);}
  .tstep span{font-size:.78rem;color:var(--ink-2);line-height:1.35;}
  .askteaser{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:var(--surface);display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
  .askteaser .t{font-family:var(--display);font-size:1.15rem;color:var(--ink);}
  .askteaser .s{font-size:.85rem;color:var(--ink-2);}
  .askteaser button{background:var(--slate);color:#fff;padding:9px 16px;border-radius:9px;font-size:.86rem;font-weight:500;}
  /* home refined */
  .creds{display:flex;flex-wrap:wrap;gap:9px 24px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);}
  .creds span{font-family:var(--mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);position:relative;padding-left:15px;}
  .creds span::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:5px;height:5px;border-radius:50%;background:var(--signal);}
  .wfcards2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:640px){.wfcards2{grid-template-columns:1fr;}}
  .wfcards2 .wfcard{width:100%;text-align:left;display:block;padding:20px 22px;border-radius:14px;}
  .wfcards2 .wfcard h4{font-family:var(--display);font-weight:500;font-size:1.2rem;margin:0 0 7px;}
  .wfcards2 .wfcard p{font-size:.86rem;color:var(--ink-2);margin:0 0 16px;line-height:1.45;}
  .wfcards2 .wfcard .cnt{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--slate);border-top:1px solid var(--line);padding-top:12px;}
  .wfcards2 .wfcard .cnt span{transition:transform .14s;font-size:1rem;}
  .wfcards2 .wfcard:hover .cnt span{transform:translateX(4px);}
  .spotlight{border:1px solid var(--line-2);border-top:3px solid var(--signal);border-radius:4px 4px 16px 16px;padding:30px 32px;background:var(--surface);box-shadow:0 18px 44px -28px rgba(27,26,21,.4);}
  .sp-top{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .sp-tag{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;}
  .sp-h{font-family:var(--display);font-weight:500;font-size:clamp(1.6rem,3.4vw,2.2rem);line-height:1.1;margin:0 0 10px;letter-spacing:-.01em;}
  .sp-tldr{font-size:.98rem;color:var(--ink-2);margin:0 0 20px;max-width:64ch;line-height:1.55;}
  .sp-quote{border-left:3px solid var(--signal);margin:0 0 22px;padding:4px 0 4px 20px;font-family:var(--display);font-style:italic;font-size:clamp(1.1rem,2.2vw,1.35rem);line-height:1.42;color:var(--ink);}
  .sp-quote cite{display:block;font-family:var(--mono);font-style:normal;font-size:10px;color:var(--ink-3);margin-top:10px;letter-spacing:.02em;}
  .sp-read{background:var(--signal);color:#fff;padding:11px 20px;border-radius:10px;font-weight:600;font-size:.9rem;}
  .trust{margin-bottom:10px;}
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <button class="brand" id="brandHome" style="letter-spacing:.14em">FIELDNOTE<span>.</span></button>
    <nav class="tabs" id="tabs">
      <button data-v="home" class="on">Home</button>
      <button data-v="library">Library</button>
      <button data-v="chat">Ask FieldNote</button>
    </nav>
    <div class="spacer"></div>
    <button class="rolechip" id="roleChip"><span class="r-txt">Role: <b id="roleTxt">—</b></span><span class="edit">edit</span></button>
    <button class="iconbtn" id="themeBtn" title="Theme">◐</button>
  </div>
</header>
<main id="app"></main>

<script>
(function(){
  "use strict";
  // localStorage shim (opaque-origin safe)
  var LS=(function(){try{var k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);return localStorage;}catch(e){var m={};return{getItem:function(k){return k in m?m[k]:null;},setItem:function(k,v){m[k]=String(v);},removeItem:function(k){delete m[k];}};}})();

  /* ---------------- DATA: real scrubbed Klarna records + labelled candidates ---------------- */

  /* ---------------- RENDER: chat ---------------- */
  var STOP={what:1,did:1,do:1,does:1,done:1,for:1,the:1,and:1,are:1,was:1,were:1,how:1,they:1,them:1,their:1,its:1,you:1,your:1,our:1,that:1,this:1,use:1,used:1,using:1,get:1,got:1,about:1,tell:1,with:1,from:1,into:1,any:1,all:1,can:1,could:1,would:1,should:1,have:1,has:1,had:1,who:1,when:1,where:1,which:1,there:1};
  var CSVOCAB={customer:1,customers:1,support:1,service:1,cx:1,chat:1,chats:1,deflection:1,deflect:1,agent:1,agents:1,assist:1,assistant:1,automation:1,automate:1,automated:1,ai:1,bot:1,chatbot:1,llm:1,roi:1,"return":1,results:1,result:1,outcome:1,outcomes:1,cost:1,costs:1,save:1,savings:1,saved:1,profit:1,model:1,models:1,openai:1,deploy:1,deployment:1,deployed:1,build:1,built:1,architecture:1,resolution:1,resolve:1,csat:1,ticket:1,tickets:1,quality:1,risk:1,risks:1,challenge:1,challenges:1,fail:1,failed:1,failure:1,wrong:1,walk:1,walkback:1,contain:1,containment:1};
  function wordsOf(s){var o={};(s||"").toLowerCase().split(/[^a-z0-9]+/).forEach(function(w){if(w)o[w]=1;});return o;}
  function groundedAnswer(q){
    var ql=q.toLowerCase();
    var terms=ql.split(/[^a-z0-9]+/).filter(function(t){return t.length>2 && !STOP[t];});
    // score verified records: term must be a whole word in the record's own identity OR a customer-support vocabulary word
    var scored=RECORDS.filter(function(r){return r.status==="verified";}).map(function(r){
      var rw=wordsOf(r.company+" "+r.workflow+" "+(r.models||[]).join(" ")+" "+(r.speaker||""));
      var s=0; terms.forEach(function(t){if(rw[t]||CSVOCAB[t])s++;});
      return {r:r,s:s};
    }).sort(function(a,b){return b.s-a.s;});
    var top=scored[0];
    // out of corpus
    if(!top||top.s===0){
      // maybe a candidate matches
      var cand=RECORDS.filter(function(r){return r.status==="candidate";}).some(function(r){return ql.indexOf(r.company.toLowerCase())>=0;});
      if(cand) return {t:"I have a <strong>candidate</strong> record for that company, but it hasn’t passed verification yet, so I can’t answer from it. Grounded answers come only from verified records.",cites:[{t:"no verified source",warn:true}]};
      return {t:"That isn’t in the verified library yet. I only answer from scrubbed, verified records — I won’t guess. Try asking about <strong>Klarna’s customer-support automation</strong>.",cites:[{t:"not in corpus",warn:true}]};
    }
    var r=top.r, body="";
    if(/roi|result|outcome|number|metric|save|saving|impact|profit/.test(ql)){
      body="For <strong>"+r.company+"</strong>: "+((r.metrics&&r.metrics.length)?r.metrics.slice(0,4).map(function(m){return m.v+" "+m.l;}).join("; "):"no outcome figures were disclosed in the firsthand sources")+"."+(r.conflict?" ⚠️ "+r.conflict:"");
    } else if(/model|tech|architect|build|how/.test(ql)){
      body="<strong>"+r.company+"</strong> — "+esc(r.solution);
    } else if(/risk|challenge|wrong|fail|problem|caveat|boundary|quality/.test(ql)){
      body="The honest boundary for <strong>"+r.company+"</strong>: "+esc(r.boundaries);
    } else {
      body=esc(r.tldr);
    }
    return {t:body, cites:[{t:r.id+" · "+r.company+" ("+r.grade+")"}], openId:r.id};
  }

  function chatView(){
    var log=state.chat.map(function(m){
      if(m.role==="u") return '<div class="msg u">'+esc(m.text)+'</div>';
      var cites=(m.cites||[]).map(function(c){return '<span class="cite'+(c.warn?" warn":"")+'"'+(m.openId?' data-open-cite="'+m.openId+'"':"")+'>'+esc(c.t)+'</span>';}).join("");
      return '<div class="msg a"><div class="who">FieldNote · grounded</div><div class="bubble">'+m.text+(cites?'<div class="cites">'+cites+'</div>':"")+'</div></div>';
    }).join("");
    if(!state.chat.length){
      log='<div class="msg a"><div class="who">FieldNote · grounded</div><div class="bubble">Hi — I answer <strong>only from verified records</strong> and cite them. Ask me about a deployment. If it’s not in the library, I’ll say so rather than guess.</div></div>';
    }
    var sugg=["What did Klarna do for customer support?","What were Chime’s results?","What models did Nubank use?","What are the risks or caveats?"];
    return '<div class="chat"><div class="chatwin"><div class="chatlog" id="chatlog">'+log+'</div>'+
      '<div class="suggest">'+sugg.map(function(s){return '<button data-ask="'+esc(s)+'">'+esc(s)+'</button>';}).join("")+'</div>'+
      '<div class="chatin"><input id="chatInp" placeholder="Ask about a deployment…"><button id="chatSend">↑</button></div></div>'+
      '<div class="disclaimer">Prototype: answers are generated by deterministic retrieval over the embedded verified records (a faithful stand-in for the grounded, server-side RAG chatbot). It never invents — out-of-corpus questions are refused. Runs on FieldNote’s side; costs the user no tokens.</div></div>';
  }

  /* ---------------- MAIN RENDER ---------------- */
  function render(){
    roleTxt.textContent=state.role||"—";
    if(state.view==="home"){
      app.innerHTML = homeView();
    } else if(state.view==="library"){
      app.innerHTML = state.open ? detailView(RECORDS.filter(function(r){return r.id===state.open;})[0]) : libraryView();
    } else {
      app.innerHTML = chatView();
      var cl=document.getElementById("chatlog"); if(cl) cl.scrollTop=cl.scrollHeight;
    }
    bind();
    document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.v===state.view);});
  }

  function ask(text){
    if(!text.trim()) return;
    state.chat.push({role:"u",text:text});
    var a=groundedAnswer(text);
    state.chat.push({role:"a",text:a.t,cites:a.cites,openId:a.openId});
    render();
  }

  /* ---------------- EVENT BINDING ---------------- */
  function bind(){
    document.querySelectorAll("[data-goto]").forEach(function(el){el.onclick=function(){state.view=el.dataset.goto;state.open=null;window.scrollTo(0,0);render();};});
    document.querySelectorAll("[data-wf]").forEach(function(el){el.onclick=function(){state.workflow=el.dataset.wf;state.view="library";state.open=null;window.scrollTo(0,0);render();};});
    document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(){state.view="library";state.open=el.dataset.open;window.scrollTo(0,0);render();};});
    document.querySelectorAll("[data-back]").forEach(function(el){el.onclick=function(){state.open=null;render();};});
    document.querySelectorAll("[data-facet]").forEach(function(el){el.onclick=function(){
      var f=el.dataset.facet,v=el.dataset.val; state[f]=state[f]===v?"":v; render();
    };});
    var s=document.getElementById("searchInp"); if(s) s.oninput=function(){state.q=s.value; var recs=filtered();
      // light re-render of just cards would be nicer; full re-render keeps it simple but loses focus, so update count+cards only
      var host=document.querySelector(".lib > section"); if(host){ var pos=s.selectionStart;
        host.innerHTML='<div class="count">'+recs.length+' record'+(recs.length!==1?"s":"")+'</div><div class="cards">'+
          recs.map(function(r){return cardHTML(r);}).join("")+'</div>';
        document.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(){state.open=el.dataset.open;window.scrollTo(0,0);render();};});
      }
    };
    var vo=document.getElementById("verOnly"); if(vo) vo.onchange=function(){state.verifiedOnly=vo.checked;render();};
    var cf=document.getElementById("clearF"); if(cf) cf.onclick=function(){state.q="";state.company="";state.workflow="";state.model="";state.grade="";state.verifiedOnly=false;render();};
    document.querySelectorAll("[data-tier]").forEach(function(el){el.onclick=function(){var id=el.dataset.tier;var b=document.getElementById(id);if(b){var open=b.style.display!=="none";b.style.display=open?"none":"block";el.querySelector("span:last-child").textContent=open?"+":"–";}};});
    // chat
    var ci=document.getElementById("chatInp"),cs=document.getElementById("chatSend");
    if(cs) cs.onclick=function(){ask(ci.value);};
    if(ci) ci.onkeydown=function(e){if(e.key==="Enter"){ask(ci.value);}};
    document.querySelectorAll("[data-ask]").forEach(function(el){el.onclick=function(){ask(el.dataset.ask);};});
    document.querySelectorAll("[data-open-cite]").forEach(function(el){el.onclick=function(){state.view="library";state.open=el.dataset.openCite;render();};});
  }
  function cardHTML(r){
    var badge = r.status==="verified"?'<span class="badge ver">verified</span>':r.status==="hold"?'<span class="badge hold">hold</span>':'<span class="badge cand">candidate</span>';
    var mtags=(r.models||[]).filter(function(m){return m!=="—";}).map(function(m){return '<span class="tag mdl">'+esc(m)+'</span>';}).join("");
    return '<div class="card" data-open="'+r.id+'"><div class="row1"><div class="logo">'+initials(r.company)+'</div><h3>'+esc(r.company)+'</h3><span class="grade '+gcls(r.grade)+'">'+r.grade+'</span>'+badge+'<span class="fresh">'+esc(r.fresh)+'</span></div><div class="tldr">'+esc(r.tldr)+'</div><div class="tags"><span class="tag">'+esc(r.workflow)+'</span>'+mtags+'</div></div>';
  }

  // top-level controls
  document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){state.view=b.dataset.v;state.open=null;render();};});
  document.getElementById("brandHome").onclick=function(){state.view="home";state.open=null;window.scrollTo(0,0);render();};
  document.getElementById("roleChip").onclick=roleModal;
  document.getElementById("themeBtn").onclick=function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":(cur==="light"?"dark":"dark");
    document.documentElement.setAttribute("data-theme",next);
  };

  // boot
  if(!state.role){ roleModal(); } else { roleTxt.textContent=state.role; }
  render();
})();
</script>
</body>
</html>
