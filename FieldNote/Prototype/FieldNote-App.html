<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FieldNote</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;450;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --bg:#F5F6F8;--panel:#FFFFFF;--panel-2:#F1F3F6;--panel-3:#E9ECF1;
    --sidebar:#12161C;--side-ink:#C4CDD8;--side-ink-2:#828E9D;--side-active:#1E252E;--side-line:#232A33;
    --ink:#161A20;--ink-2:#525A66;--ink-3:#8992A0;--line:#E4E7EC;--line-2:#D5DAE1;
    --brand:#177A5C;--brand-2:#1C9270;--brand-soft:#E2F0EB;--brand-ink:#0E5C44;
    --gA:#177A5C;--gA-s:#E2F0EB;--gB:#3A6DAE;--gB-s:#E5ECF6;--gC:#A9741A;--gC-s:#F6ECD6;--gD:#AC443C;--gD-s:#F6E1DE;--gX:#7A828E;--gX-s:#EDEFF2;
    --warn:#A9741A;--warn-s:#F6ECD6;--crit:#AC443C;--crit-s:#F6E1DE;--ok:#177A5C;--ok-s:#E2F0EB;
    --shadow-sm:0 1px 2px rgba(16,20,28,.06);--shadow:0 4px 16px -6px rgba(16,20,28,.14);--shadow-lg:0 16px 40px -18px rgba(16,20,28,.28);
    --display:'Fraunces',Georgia,serif;--ui:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
    --r:10px;
  }
  :root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
    --bg:#0D1013;--panel:#15191F;--panel-2:#1B2027;--panel-3:#222833;
    --sidebar:#0A0C0F;--side-ink:#B9C2CE;--side-ink-2:#727D8B;--side-active:#191F27;--side-line:#1E242C;
    --ink:#E8ECF1;--ink-2:#A3ACB9;--ink-3:#6C7581;--line:#252B33;--line-2:#333A44;
    --brand:#43C79C;--brand-2:#54D4AA;--brand-soft:#11291F;--brand-ink:#6BD9B3;
    --gA:#43C79C;--gA-s:#11291F;--gB:#77A6E6;--gB-s:#152234;--gC:#DDA64C;--gC-s:#2A2211;--gD:#E58B82;--gD-s:#2C1815;--gX:#8A929E;--gX-s:#1E242C;
    --warn:#DDA64C;--warn-s:#2A2211;--crit:#E58B82;--crit-s:#2C1815;--ok:#43C79C;--ok-s:#11291F;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 6px 20px -8px rgba(0,0,0,.6);--shadow-lg:0 20px 48px -20px rgba(0,0,0,.75);
  }}
  :root[data-theme="dark"]{
    --bg:#0D1013;--panel:#15191F;--panel-2:#1B2027;--panel-3:#222833;
    --sidebar:#0A0C0F;--side-ink:#B9C2CE;--side-ink-2:#727D8B;--side-active:#191F27;--side-line:#1E242C;
    --ink:#E8ECF1;--ink-2:#A3ACB9;--ink-3:#6C7581;--line:#252B33;--line-2:#333A44;
    --brand:#43C79C;--brand-2:#54D4AA;--brand-soft:#11291F;--brand-ink:#6BD9B3;
    --gA:#43C79C;--gA-s:#11291F;--gB:#77A6E6;--gB-s:#152234;--gC:#DDA64C;--gC-s:#2A2211;--gD:#E58B82;--gD-s:#2C1815;--gX:#8A929E;--gX-s:#1E242C;
    --warn:#DDA64C;--warn-s:#2A2211;--crit:#E58B82;--crit-s:#2C1815;--ok:#43C79C;--ok-s:#11291F;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 6px 20px -8px rgba(0,0,0,.6);--shadow-lg:0 20px 48px -20px rgba(0,0,0,.75);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  svg{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:0 0 auto;}
  .crumb svg{width:13px;height:13px;opacity:.65;margin:0 1px;}
  .side-brand .logo svg{width:17px;height:17px;}
  .mbox .logo svg{width:20px;height:20px;}
  .chatin button svg{width:18px;height:18px;}
  .msg .who svg{width:12px;height:12px;}
  ::selection{background:var(--brand-soft);}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:244px 1fr;min-height:100vh;}
  .sidebar{background:var(--sidebar);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;border-right:1px solid var(--side-line);}
  .side-brand{padding:20px 20px 16px;display:flex;align-items:center;gap:10px;}
  .side-brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand-2),var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
  .side-brand .wm{font-family:var(--display);font-weight:600;font-size:18px;color:#fff;letter-spacing:.01em;}
  .side-brand .wm i{color:var(--brand-2);font-style:normal;}
  .side-nav{padding:8px 12px;flex:1;overflow-y:auto;}
  .side-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--side-ink-2);padding:14px 12px 6px;}
  .nav-i{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--side-ink);font-size:13.5px;font-weight:450;width:100%;text-align:left;margin-bottom:2px;position:relative;}
  .nav-i svg{width:18px;height:18px;opacity:.85;flex-shrink:0;}
  .nav-i:hover{background:var(--side-active);color:#fff;}
  .nav-i.on{background:var(--side-active);color:#fff;font-weight:500;}
  .nav-i.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--brand-2);}
  .nav-i .ct{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--side-active);color:var(--side-ink);padding:1px 7px;border-radius:20px;}
  .nav-i.on .ct{background:var(--brand);color:#fff;}
  .side-foot{border-top:1px solid var(--side-line);padding:12px;}
  .side-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;width:100%;text-align:left;}
  .side-user:hover{background:var(--side-active);}
  .side-user .av{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex-shrink:0;}
  .side-user .nm{font-size:12.5px;color:#fff;font-weight:500;line-height:1.2;}
  .side-user .rl{font-size:11px;color:var(--side-ink-2);}

  .main{min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);padding:11px 26px;display:flex;align-items:center;gap:14px;}
  .hamb{display:none;}
  .search{flex:1;max-width:460px;position:relative;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink-3);}
  .search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:13.5px;}
  .search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);}
  .search input::placeholder{color:var(--ink-3);}
  .topsp{flex:1;}
  .tbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative;}
  .tbtn:hover{border-color:var(--line-2);color:var(--ink);}
  .tbtn svg{width:17px;height:17px;}
  .tbtn .dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:20px;background:var(--brand);color:#fff;font-size:9.5px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:var(--mono);}
  .content{padding:26px;max-width:1180px;width:100%;margin:0 auto;}

  @media(max-width:900px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:fixed;left:0;top:0;z-index:60;width:250px;transform:translateX(-100%);transition:transform .2s;}
    body.nav-open .sidebar{transform:translateX(0);box-shadow:var(--shadow-lg);}
    body.nav-open::after{content:"";position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
    .hamb{display:flex;}
    .content{padding:18px;}
    .topbar{padding:10px 16px;}
  }

  /* ---------- primitives ---------- */
  .page-h{margin:0 0 4px;}
  .page-h h1{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,3vw,1.9rem);margin:0;letter-spacing:-.01em;color:var(--ink);}
  .page-sub{color:var(--ink-2);font-size:14px;margin:4px 0 22px;}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:8px;}
  .row{display:flex;align-items:center;gap:10px;}
  .wrap-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:26px 0 12px;}
  .wrap-h h2{font-family:var(--ui);font-weight:600;font-size:1.05rem;margin:0;color:var(--ink);}
  .wrap-h .lnk{font-size:12.5px;color:var(--brand-ink);font-weight:500;}
  .muted{color:var(--ink-3);font-size:12.5px;}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);}
  .btn:hover{border-color:var(--line-2);}
  .btn svg{width:15px;height:15px;}
  .btn.pri{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn.pri:hover{background:var(--brand-2);}
  .btn.sm{padding:6px 11px;font-size:12px;}
  .btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink);}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);}
  .grade{font-family:var(--mono);font-weight:600;font-size:11px;width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .gA{background:var(--gA-s);color:var(--gA);}.gB{background:var(--gB-s);color:var(--gB);}.gC{background:var(--gC-s);color:var(--gC);}.gD{background:var(--gD-s);color:var(--gD);}.gX{background:var(--gX-s);color:var(--gX);}
  .badge{font-family:var(--mono);font-size:9px;font-weight:500;letter-spacing:.03em;padding:2px 7px;border-radius:20px;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px;}
  .b-ver{background:var(--ok-s);color:var(--ok);}.b-cand{background:var(--warn-s);color:var(--warn);}.b-hold{background:var(--crit-s);color:var(--crit);}
  .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;padding:2px 8px;border-radius:6px;background:var(--panel-2);color:var(--ink-2);text-transform:uppercase;}
  .tag.mdl{background:var(--brand-soft);color:var(--brand-ink);}
  .logo-sq{width:34px;height:34px;border-radius:8px;background:var(--panel-3);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:820px){.kpis{grid-template-columns:1fr 1fr;}}
  .kpi{padding:16px 18px;}
  .kpi .lab{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px;}
  .kpi .lab svg{width:15px;height:15px;color:var(--brand);}
  .kpi .val{font-family:var(--display);font-size:2rem;font-weight:600;color:var(--ink);line-height:1.1;margin-top:8px;}
  .kpi .sub{font-size:11.5px;color:var(--ink-3);margin-top:3px;}

  /* record grid cards */
  .rgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  @media(max-width:720px){.rgrid{grid-template-columns:1fr;}}
  .rgrid.one{grid-template-columns:1fr;}
  .rcard{padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .12s,transform .12s,box-shadow .12s;}
  .rcard:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow);}
  .rcard .top{display:flex;align-items:flex-start;gap:11px;}
  .rcard .co{font-weight:600;font-size:15px;color:var(--ink);}
  .rcard .sp{font-size:11.5px;color:var(--ink-3);}
  .rcard .tt{font-family:var(--display);font-weight:500;font-size:16px;line-height:1.25;color:var(--ink);}
  .rcard .dk{font-size:12.5px;color:var(--ink-2);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .rcard .foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:4px;}
  .rcard .acts{margin-left:auto;display:flex;gap:4px;}
  .iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--ink-3);}
  .iconbtn:hover{color:var(--ink);border-color:var(--line-2);}
  .iconbtn.on{color:var(--brand-ink);background:var(--brand-soft);border-color:var(--brand);}
  .iconbtn svg{width:15px;height:15px;}

  /* filter bar */
  .fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .selct{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font-size:12.5px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .fchip{padding:6px 11px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--ink-2);background:var(--panel);}
  .fchip:hover{border-color:var(--line-2);}
  .fchip.on{background:var(--ink);color:var(--panel);border-color:var(--ink);}

  /* detail */
  .dwrap{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start;}
  @media(max-width:920px){.dwrap{grid-template-columns:1fr;}}
  .crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:14px;display:flex;align-items:center;gap:7px;}
  .crumb a{color:var(--brand-ink);}
  .dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;}
  .dhead .logo-sq{width:46px;height:46px;font-size:16px;border-radius:10px;}
  .dtitle{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,3vw,1.85rem);line-height:1.14;margin:0 0 5px;color:var(--ink);letter-spacing:-.01em;}
  .dmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0;}
  .sec{padding:18px 20px;margin-bottom:14px;}
  .sec h3{font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);margin:0 0 12px;}
  .fld{padding:12px 0;border-top:1px solid var(--line);}
  .fld:first-of-type{border-top:none;padding-top:0;}
  .fld .l{font-size:11px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px;}
  .fld p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.55;}
  .mtx{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  @media(max-width:540px){.mtx{grid-template-columns:1fr 1fr;}}
  .mtx div{background:var(--panel);padding:11px 13px;}
  .mtx b{font-family:var(--display);font-size:1.3rem;font-weight:600;display:block;line-height:1;color:var(--ink);}
  .mtx span{font-size:11px;color:var(--ink-2);display:block;margin-top:6px;line-height:1.3;}
  .quote{border-left:2.5px solid var(--brand);padding:6px 0 6px 15px;margin:11px 0;font-size:14px;line-height:1.5;color:var(--ink);font-style:italic;}
  .quote cite{display:block;font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:7px;}
  .flagbar{background:var(--warn-s);border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--ink);margin-top:10px;}
  .flagbar b{color:var(--warn);}
  .side-panel{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px;}
  .sp-card{padding:16px;}
  .sp-card h4{font-size:11px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;}
  .actgrid{display:flex;flex-direction:column;gap:8px;}
  .actgrid .btn{justify-content:flex-start;width:100%;}
  .noteta{width:100%;min-height:80px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);padding:9px 11px;font-size:12.5px;resize:vertical;}
  .noteta:focus{outline:none;border-color:var(--brand);}
  .rel a{display:flex;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;}
  .rel a:first-child{border-top:none;}
  .rel .rl-co{font-size:12.5px;font-weight:500;color:var(--ink);}
  .rel .rl-wf{font-size:11px;color:var(--ink-3);}
  .fitcard{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 30%,transparent);border-radius:10px;padding:14px 16px;margin-bottom:14px;}
  .fitcard .k{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:6px;}
  .fitcard p{margin:0;font-size:13px;color:var(--ink);line-height:1.5;}
  .tr-panel{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);}
  .tr-line{display:flex;gap:14px;padding:11px 15px;border-bottom:1px solid var(--line);}
  .tr-line:last-child{border-bottom:none;}
  .tr-ts{font-family:var(--mono);font-size:11px;color:var(--brand-ink);flex:0 0 auto;width:50px;padding-top:1px;}
  .tr-line>div{font-size:13px;color:var(--ink-2);line-height:1.55;}
  .tr-sp{font-weight:600;color:var(--ink);}
  .tr-foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;}
  .tr-rights{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:1;min-width:180px;line-height:1.5;}

  /* compare */
  .cmpwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);}
  table.cmp{border-collapse:collapse;width:100%;min-width:680px;font-size:13px;}
  table.cmp th,table.cmp td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;}
  table.cmp th:last-child,table.cmp td:last-child{border-right:none;}
  table.cmp thead th{background:var(--panel-2);position:sticky;top:0;}
  table.cmp .rl{font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);background:var(--panel-2);width:150px;white-space:nowrap;}
  table.cmp tbody tr:last-child td{border-bottom:none;}
  .cmp-co{font-weight:600;font-size:15px;color:var(--ink);}
  .emptycmp{text-align:center;padding:50px 20px;}

  /* benchmarks */
  .bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .bar-row .bl{width:130px;font-size:12.5px;color:var(--ink-2);flex-shrink:0;}
  .bar-track{flex:1;height:22px;background:var(--panel-2);border-radius:6px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:6px;background:var(--brand);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:600;font-family:var(--mono);min-width:26px;}
  .bar-fill.gAf{background:var(--gA);}.bar-fill.gBf{background:var(--gB);}.bar-fill.gCf{background:var(--gC);}.bar-fill.gDf{background:var(--gD);}

  /* chat */
  .chatwrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;height:calc(100vh - 150px);}
  .chatlog{flex:1;overflow-y:auto;padding:6px 2px 16px;display:flex;flex-direction:column;gap:16px;}
  .msg{max-width:88%;font-size:14px;line-height:1.55;}
  .msg.u{align-self:flex-end;background:var(--brand);color:#fff;padding:10px 15px;border-radius:14px 14px 4px 14px;}
  .msg.a .who{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:6px;display:flex;align-items:center;gap:6px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:11px 20px;border-radius:10px;font-size:13px;z-index:90;opacity:0;transition:.25s;box-shadow:var(--shadow-lg);pointer-events:none;}

    var cos=(function(){var o={};RECORDS.forEach(function(r){o[r.company]=1;});return Object.keys(o).length;})();
    var wfs=(function(){var o={};vs.forEach(function(r){wfsOf(r).forEach(function(w){o[w]=1;});});return Object.keys(o).length;})();
    var reco=vs.filter(function(r){return r.industry===S.industry;});if(!reco.length)reco=vs;
    var recents=S.recent.map(rec).filter(Boolean);

    var h='<div class="page-h"><div class="eyebrow">Welcome back</div><h1>Good to see you, '+esc((role.split(" ")[0]||role))+'.</h1></div>'+
      '<div class="page-sub">Here’s what other teams actually did with AI — verified, graded and ready to inform your next decision.</div>'+
      '<div class="kpis">'+
        kpi("library","Verified records",vs.length,"firsthand, human-scrubbed")+
        kpi("bench","Avg. evidence grade",avg,"across the corpus")+
        kpi("compare","CS workflows",wfs,"covered so far")+
        kpi("collections","Companies",cos,"named operators")+
      '</div>'+
      '<div class="wrap-h"><h2>Recommended for you</h2><span class="lnk" data-nav="library">Browse all →</span></div>'+
      '<div class="rgrid">'+reco.slice(0,2).map(rcard).join("")+'</div>';

    if(recents.length){
      h+='<div class="wrap-h"><h2>Recently viewed</h2></div><div class="rgrid">'+recents.slice(0,2).map(rcard).join("")+'</div>';
    }
    // coverage
    var wfAll=["Tier-1 deflection","Agent-assist","Disputes & transactions"];
    var wfc=function(w){return vs.filter(function(r){return wfsOf(r).indexOf(w)>=0;}).length;};
    h+='<div class="wrap-h"><h2>Coverage by workflow</h2><span class="muted">verified records</span></div><div class="card" style="padding:18px 20px">';
    var maxc=Math.max.apply(null,wfAll.map(wfc).concat([1]));
    wfAll.forEach(function(w){var c=wfc(w);
      h+='<div class="bar-row"><div class="bl">'+w+'</div><div class="bar-track"><div class="bar-fill" style="width:'+(c?Math.max(12,c/maxc*100):3)+'%">'+(c||"0")+'</div></div></div>';
    });
    h+='<div class="muted" style="margin-top:6px">A record can span more than one workflow — e.g. Chime covers deflection and disputes.</div></div>';
    return h;
  }
  function kpi(ic,lab,val,sub){return '<div class="card kpi"><div class="lab">'+svg(ic)+lab+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>';}

  /* ---------------- VIEW: LIBRARY ---------------- */
  function filtered(){
    var arr=RECORDS.filter(function(r){
      if(S.verifiedOnly && r.status!=="verified")return false;
      if(S.company && r.company!==S.company)return false;
      if(S.workflow && wfsOf(r).indexOf(S.workflow)<0)return false;
      if(S.grade && r.grade!==S.grade)return false;
      if(S.q){var b=(r.company+" "+r.workflow+" "+(r.models||[]).join(" ")+" "+(r.title||"")+" "+r.tldr+" "+(r.speaker||"")).toLowerCase();if(b.indexOf(S.q.toLowerCase())<0)return false;}
      return true;
    });
    var ord={A:4,B:3,C:2,D:1,"—":0};
    if(S.sort==="grade")arr.sort(function(a,b){return (ord[b.grade]||0)-(ord[a.grade]||0);});
    else if(S.sort==="company")arr.sort(function(a,b){return a.company.localeCompare(b.company);});
    else arr.sort(function(a,b){return (b.status==="verified")-(a.status==="verified");});
    return arr;
  }

    var companies=uniq(RECORDS.map(function(r){return r.company;}));

      '<div class="chips">'+wfs.map(function(w){return '<button class="fchip'+(S.workflow===w?" on":"")+'" data-f="workflow" data-v="'+esc(w)+'">'+esc(w)+'</button>';}).join("")+'</div>'+

    h+=recs.length?'<div class="rgrid">'+recs.map(rcard).join("")+'</div>':'<div class="empty"><span class="eic">'+svg('library')+'</span><div>No records match these filters.</div></div>';

      (S.role?'<div class="fitcard"><div class="k">Why this matters to you</div><p>You’re '+esc(S.role)+' in '+esc(S.industry)+'. '+(r.industry===S.industry?'This is a '+esc(r.industry.toLowerCase())+' peer — directly comparable.':esc(r.company)+' is '+esc(r.industry.toLowerCase())+', so treat specifics as directional — but the lesson transfers.')+' '+esc(r.fit||"")+'</p></div>':'')+
      '<div class="card sec"><h3>Summary</h3><div class="fld"><p style="font-size:15px;color:var(--ink)">'+esc(r.tldr)+'</p></div></div>'+
      '<div class="card sec"><h3>Decision card</h3>'+

        '<div class="fld"><div class="l">Outcomes</div>'+(mets?'<div class="mtx">'+mets+'</div>':'<p style="font-style:italic;color:var(--ink-3)">Not disclosed in the firsthand sources — recorded as not_disclosed.</p>')+
          (r.conflict?'<div class="flagbar"><b>Metric conflict caught:</b> '+esc(r.conflict)+'</div>':'')+'</div>'+
        fld("Boundaries & caveats",r.boundaries)+'</div>'+
      '<div class="card sec"><h3>Evidence — quotes & sources</h3>'+evs+

        '<div class="fld"><div class="l">Grade rationale — '+r.grade+'</div><p>Graded on source strength, baseline presence and metric hygiene. First-party/firsthand disclosures with numbers land around B; directional claims without measured outcomes land at C. Company-reported figures never reach A without an independent control.</p></div></div>'+trHtml;

    var right='<div class="side-panel">'+

        '<button class="btn '+(cp?"on":"")+'" data-cmp="'+r.id+'">'+svg('compare')+(cp?"In compare":"Add to compare")+'</button>'+
        '<button class="btn" data-print>'+svg('print')+'Export / print</button>'+
      '</div></div>'+

      (related.length?'<div class="card sp-card"><h4>Related records</h4><div class="rel">'+related.map(function(x){return '<a data-open="'+x.id+'"><span class="logo-sq" style="width:26px;height:26px;font-size:10px">'+initials(x.company)+'</span><span style="flex:1"><span class="rl-co">'+esc(x.company)+'</span><br><span class="rl-wf">'+esc(x.workflow)+'</span></span><span class="grade '+gcls(x.grade)+'">'+x.grade+'</span></a>';}).join("")+'</div></div>':'')+
      '</div>';

    return '<div class="crumb"><a data-nav="library">Library</a> <span style="opacity:.4;margin:0 7px">›</span> '+esc(r.company)+'</div>'+

    rows.forEach(function(row){t+='<tr><td class="rl">'+row[0]+'</td>'+recs.map(function(r){return '<td>'+row[1](r)+'</td>';}).join("")+'</tr>';});

  /* ---------------- VIEW: BENCHMARKS ---------------- */
  function vBenchmarks(){

  /* ---------------- VIEW: CHAT ---------------- */
  var STOP={what:1,did:1,do:1,does:1,done:1,for:1,the:1,and:1,are:1,was:1,were:1,how:1,they:1,them:1,their:1,its:1,you:1,your:1,our:1,that:1,this:1,use:1,used:1,using:1,get:1,got:1,about:1,tell:1,with:1,from:1,into:1,any:1,all:1,can:1,could:1,would:1,should:1,have:1,has:1,had:1,who:1,when:1,where:1,which:1,there:1,were:1};
  var CSVOCAB={customer:1,customers:1,support:1,service:1,cx:1,chat:1,chats:1,deflection:1,deflect:1,agent:1,agents:1,assist:1,assistant:1,automation:1,automate:1,automated:1,ai:1,bot:1,chatbot:1,voicebot:1,llm:1,roi:1,"return":1,results:1,result:1,outcome:1,outcomes:1,cost:1,costs:1,save:1,savings:1,saved:1,profit:1,model:1,models:1,openai:1,anthropic:1,mistral:1,rag:1,deploy:1,deployment:1,deployed:1,build:1,built:1,architecture:1,resolution:1,resolve:1,csat:1,ticket:1,tickets:1,quality:1,risk:1,risks:1,challenge:1,challenges:1,fail:1,failed:1,failure:1,wrong:1,walk:1,contain:1,containment:1,dispute:1};
  function wordsOf(s){var o={};(s||"").toLowerCase().split(/[^a-z0-9]+/).forEach(function(w){if(w)o[w]=1;});return o;}
  function answer(qq){
    var ql=qq.toLowerCase();var terms=ql.split(/[^a-z0-9]+/).filter(function(t){return t.length>2&&!STOP[t];});
    var scored=verified().map(function(r){var rw=wordsOf(r.company+" "+r.workflow+" "+(r.models||[]).join(" ")+" "+(r.speaker||""));var s=0;terms.forEach(function(t){if(rw[t]||CSVOCAB[t])s++;});return {r:r,s:s};}).sort(function(a,b){return b.s-a.s;});
    var top=scored[0];
    if(!top||top.s===0){
      var cand=RECORDS.filter(function(r){return r.status==="candidate";}).some(function(r){return ql.indexOf(r.company.toLowerCase())>=0;});
      if(cand)return {t:"I have a <b>candidate</b> record for that company, but it hasn’t passed verification yet, so I can’t answer from it. Grounded answers come only from verified records.",cites:[{t:"no verified source",warn:true}]};
      return {t:"That isn’t in the verified library yet. I only answer from scrubbed, verified records — I won’t guess. Try <b>Klarna</b>, <b>Chime</b> or <b>Nubank</b>.",cites:[{t:"not in corpus",warn:true}]};
    }
    var r=top.r,body="";
    if(/roi|result|outcome|number|metric|save|saving|impact|profit|dispute|resolution/.test(ql)) body="For <b>"+r.company+"</b>: "+((r.metrics&&r.metrics.length)?r.metrics.slice(0,4).map(function(m){return m.v+" "+m.l;}).join("; "):"no outcome figures were disclosed in the firsthand sources")+"."+(r.conflict?" ⚠️ "+esc(r.conflict):"");
    else if(/model|tech|architect|build|rag|how/.test(ql)) body="<b>"+r.company+"</b> — "+esc(r.solution);
    else if(/risk|challenge|wrong|fail|caveat|boundary|quality|problem/.test(ql)) body="The honest boundary for <b>"+r.company+"</b>: "+esc(r.boundaries);
    else body=esc(r.tldr);
    return {t:body,cites:[{t:r.id+" · "+r.company+" ("+r.grade+")",id:r.id}]};
  }
  function vChat(){
    var log=S.chat.map(function(m){
      if(m.role==="u")return '<div class="msg u">'+esc(m.text)+'</div>';
      var c=(m.cites||[]).map(function(x){return '<span class="cite'+(x.warn?" warn":"")+'"'+(x.id?' data-open="'+x.id+'"':"")+'>'+esc(x.t)+'</span>';}).join("");
      return '<div class="msg a"><div class="who">'+svg('spark')+'FieldNote · grounded</div><div class="bub">'+m.text+(c?'<div class="cites">'+c+'</div>':'')+'</div></div>';
    }).join("");
    if(!S.chat.length)log='<div class="msg a"><div class="who">'+svg('spark')+'FieldNote · grounded</div><div class="bub">Hi — I answer <b>only from verified records</b> and cite them. Ask me about a deployment; if it’s not in the library, I’ll say so rather than guess.</div></div>';
    var sugg=["What did Klarna do for customer support?","What were Chime’s results?","What models did Nubank use?","What are the risks or caveats?"];
    return '<div class="chatwrap"><div class="chatlog" id="chatlog">'+log+'</div>'+

      '<div class="disc">Grounded, deterministic retrieval over verified records — a faithful stand-in for the server-side RAG assistant. Never invents; out-of-corpus questions are refused; costs you no tokens.</div></div>';
  }

  /* ---------------- VIEW: METHODOLOGY ---------------- */
  function vMethod(){
    return '<div class="page-h"><h1>Methodology</h1></div><div class="page-sub">How a record earns its place — and why you can trust what you read.</div>'+
      '<div class="card sec"><h3>The firsthand rule</h3><div class="fld"><p>A record exists only if a <b>named person from a named company</b> describes <b>their own</b> deployment in their <b>own public words</b> — a talk, interview, podcast, or the company’s own writing. Test: “would that person recognise this as their own public statement?” Vendor case studies, press articles and analyst reports are out.</p></div></div>'+
      '<div class="card sec"><h3>Evidence grades</h3>'+
        gline("A","gA","Independent / production evidence with a baseline")+
        gline("B","gB","Named first-party disclosure with numbers, partial baseline")+
        gline("C","gC","Directional claim, no baseline or single-source")+
        gline("D","gD","Announcement, aspirational, or later walked back")+
        '<div class="fld"><p style="font-size:12.5px;color:var(--ink-3)">Metric hygiene is enforced: deflection ≠ resolution ≠ containment ≠ handle-rate.</p></div></div>'+
      '<div class="card sec"><h3>The SCRUB</h3><div class="fld"><p>Before publishing, a human confirms every quote against the source, logs its timestamp, checks the metric definitions, and assigns the grade. No number, model or claim appears without a verbatim quote — anything unstated is shown as <b>not_disclosed</b>. Nothing reaches the library unverified.</p></div></div>'+
      '<div class="card sec"><h3>Rights</h3><div class="fld"><p>Short excerpts, always attributed and linked to the source with a timestamp; we never host or republish the media. Transformative research and commentary.</p></div></div>';
  }
  function gline(g,c,t){return '<div class="fld" style="display:flex;gap:12px;align-items:flex-start"><span class="grade '+c+'">'+g+'</span><p style="flex:1">'+t+'</p></div>';}

  /* ---------------- ROUTER ---------------- */
  function render(){
    renderNav();
    var h="";
    if(S.view==="dashboard")h=vDashboard();
    else if(S.view==="library")h=S.open?vDetail(rec(S.open)):vLibrary();
    else if(S.view==="compare")h=vCompare();
    else if(S.view==="collections")h=vCollections();
    else if(S.view==="benchmarks")h=vBenchmarks();
    else if(S.view==="chat")h=vChat();
    else if(S.view==="method")h=vMethod();
    view.innerHTML=h;
    bind();
    var cl=document.getElementById("chatlog");if(cl)cl.scrollTop=cl.scrollHeight;
  }
  function go(v){S.view=v;S.open=null;persist();window.scrollTo(0,0);document.body.classList.remove("nav-open");render();}
  function openRec(id){S.view="library";S.open=id;pushRecent(id);persist();window.scrollTo(0,0);render();}

  function bind(){
    view.querySelectorAll("[data-open]").forEach(function(el){el.onclick=function(e){if(e.target.closest("[data-save],[data-cmp]"))return;openRec(el.getAttribute("data-open"));};});
    view.querySelectorAll("[data-nav]").forEach(function(el){el.onclick=function(){go(el.getAttribute("data-nav"));};});
    view.querySelectorAll("[data-save]").forEach(function(el){el.onclick=function(e){e.stopPropagation();toggleSave(el.getAttribute("data-save"));};});
    view.querySelectorAll("[data-cmp]").forEach(function(el){el.onclick=function(e){e.stopPropagation();toggleCompare(el.getAttribute("data-cmp"));};});
    view.querySelectorAll("[data-f]").forEach(function(el){el.onclick=function(){var f=el.getAttribute("data-f"),v=el.getAttribute("data-v");S[f]=S[f]===v?"":v;render();};});
    var vo=view.querySelector("[data-vonly]");if(vo)vo.onclick=function(){S.verifiedOnly=!S.verifiedOnly;render();};
    var so=view.querySelector("[data-sort]");if(so)so.onchange=function(){S.sort=so.value;render();};
    var cl=view.querySelector("[data-clear]");if(cl)cl.onclick=function(){S.company=S.workflow=S.grade=S.q="";S.verifiedOnly=false;document.getElementById("gsearch").value="";render();};
    var pr=view.querySelector("[data-print]");if(pr)pr.onclick=function(){window.print();};
    view.querySelectorAll("[data-note]").forEach(function(el){el.oninput=function(){S.notes[el.getAttribute("data-note")]=el.value;persist();};});
    // chat
    var ci=view.querySelector("#cin"),cs=view.querySelector("#csend");
    function ask(t){if(!t.trim())return;S.chat.push({role:"u",text:t});var a=answer(t);S.chat.push({role:"a",text:a.t,cites:a.cites});render();}
    if(cs)cs.onclick=function(){ask(ci.value);};
    if(ci)ci.onkeydown=function(e){if(e.key==="Enter")ask(ci.value);};
    view.querySelectorAll("[data-ask]").forEach(function(el){el.onclick=function(){ask(el.getAttribute("data-ask"));};});
  }

  /* ---------------- ROLE MODAL ---------------- */
  function roleModal(force){
    var roles=["Head of CX","VP Customer Support","Support Operations Lead","Director of Customer Service","Founder / CEO"];
    var inds=["Fintech","Retail / commerce","SaaS / tech","Consumer app","Telecom","Other"];
    var m=document.createElement("div");m.className="modal";
    m.innerHTML='<div class="mbox"><div class="logo">'+svg('spark')+'</div><h3>Welcome to FieldNote</h3><p>Pick a role so the workspace can tell you why each deployment matters to you. That’s the whole profile — no onboarding call.</p>'+
      '<label>Your role</label><select id="mR">'+roles.map(function(r){return '<option '+(S.role===r?"selected":"")+'>'+r+'</option>';}).join("")+'</select>'+
      '<label>Your industry</label><select id="mI">'+inds.map(function(i){return '<option '+(S.industry===i?"selected":"")+'>'+i+'</option>';}).join("")+'</select>'+
      '<button class="go" id="mG">Enter workspace</button></div>';
    document.body.appendChild(m);
    m.querySelector("#mG").onclick=function(){S.role=m.querySelector("#mR").value;S.industry=m.querySelector("#mI").value;LS.setItem("fn_role",S.role);LS.setItem("fn_industry",S.industry);document.body.removeChild(m);render();};
    if(force)m.onclick=function(e){if(e.target===m)document.body.removeChild(m);};
  }

  /* ---------------- TOP-LEVEL CONTROLS ---------------- */
  document.getElementById("app").style.display="grid";
  document.getElementById("hamb").onclick=function(){document.body.classList.toggle("nav-open");};
  document.getElementById("themeBtn").onclick=function(){var c=document.documentElement.getAttribute("data-theme");document.documentElement.setAttribute("data-theme",c==="dark"?"light":"dark");};
  document.getElementById("cmpBtn").onclick=function(){go("compare");};
  document.getElementById("userBtn").onclick=function(){roleModal(true);};
  var gs=document.getElementById("gsearch");
  gs.oninput=function(){S.q=gs.value;if(S.view!=="library"||S.open){S.view="library";S.open=null;}render();gs.focus();};
  // sidebar nav clicks (delegated since re-rendered)
  document.getElementById("nav").addEventListener("click",function(e){var b=e.target.closest("[data-nav]");if(b)go(b.getAttribute("data-nav"));});

  // boot
  if(!S.role)roleModal(false); else render();
  render();
})();
</script>
</body>
</html>
